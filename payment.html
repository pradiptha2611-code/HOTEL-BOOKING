<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - StayEase</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <h2>🏨 StayEase</h2>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="hotels.html">Hotels</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="my-bookings.html">My Bookings</a>
            <a href="login.html">Login</a>
            <a href="signup.html">Register</a>
        </div>
    </nav>
</header>

<section class="container">

    <h1>💳 Payment</h1>

    <div id="bookingSummary"></div>

    <div class="form-card">

        <h2>Select Payment Method</h2>

        <label>
            <input type="radio"
                   name="paymentMethod"
                   value="Card"
                   checked
                   onclick="showPayment('card')">
            💳 Card
        </label>

        <br>

        <label>
            <input type="radio"
                   name="paymentMethod"
                   value="UPI"
                   onclick="showPayment('upi')">
            📱 UPI
        </label>

        <br>

        <label>
            <input type="radio"
                   name="paymentMethod"
                   value="Cash"
                   onclick="showPayment('cash')">
            💵 Pay at Hotel
        </label>

        <br><br>

        <!-- CARD -->
        <div id="cardPayment">

            <h3>Card Details</h3>

            <input
                type="text"
                id="cardName"
                placeholder="Card Holder Name">

            <br><br>

            <input
                type="text"
                id="cardNumber"
                placeholder="Card Number">

            <br><br>

            <input
                type="text"
                id="expiry"
                placeholder="MM/YY">

            <br><br>

            <input
                type="password"
                id="cvv"
                placeholder="CVV">

        </div>

        <!-- UPI -->
        <div id="upiPayment" style="display:none;">

            <h3>UPI Payment</h3>

            <input
                type="text"
                id="upiId"
                placeholder="Enter UPI ID">

        </div>

        <!-- CASH -->
        <div id="cashPayment" style="display:none;">

            <h3>Pay at Hotel</h3>

            <p>
                You can pay the amount directly at the hotel
                during check-in.
            </p>

        </div>

        <br>

        <button
            type="button"
            class="btn btn-primary"
            onclick="completePayment()">
            Confirm Booking
        </button>

    </div>

</section>

<script>

const bookingData =
    localStorage.getItem("bookingData");

const summary =
    document.getElementById("bookingSummary");

if (!bookingData) {

    summary.innerHTML = `
        <div class="form-card">
            <h2>❌ No Booking Found</h2>
            <p>Please complete your booking first.</p>
            <a href="hotels.html">
                <button class="btn btn-primary">
                    Go to Hotels
                </button>
            </a>
        </div>
    `;

} else {

    const booking =
        JSON.parse(bookingData);

    summary.innerHTML = `
        <div class="form-card">

            <h2>Booking Summary</h2>

            <p>
                <strong>Booking ID:</strong>
                ${booking.bookingId}
            </p>

            <p>
                <strong>Hotel:</strong>
                ${booking.hotel.name}
            </p>

            <p>
                <strong>Location:</strong>
                ${booking.hotel.location}
            </p>

            <p>
                <strong>Room:</strong>
                ${booking.room ? booking.room.name : "Standard Room"}
            </p>

            <h2>
                Amount: ₹${booking.room
                    ? booking.room.price
                    : booking.hotel.price}
            </h2>

        </div>
    `;
}


function showPayment(type) {

    document.getElementById("cardPayment")
        .style.display = "none";

    document.getElementById("upiPayment")
        .style.display = "none";

    document.getElementById("cashPayment")
        .style.display = "none";


    if (type === "card") {

        document.getElementById("cardPayment")
            .style.display = "block";

    }

    else if (type === "upi") {

        document.getElementById("upiPayment")
            .style.display = "block";

    }

    else if (type === "cash") {

        document.getElementById("cashPayment")
            .style.display = "block";

    }
}


function completePayment() {

    const data =
        localStorage.getItem("bookingData");

    if (!data) {

        alert("No booking found!");
        return;
    }


    const booking =
        JSON.parse(data);


    const selectedPayment =
        document.querySelector(
            'input[name="paymentMethod"]:checked'
        ).value;


    // Card validation
    if (selectedPayment === "Card") {

        const cardName =
            document.getElementById("cardName").value.trim();

        const cardNumber =
            document.getElementById("cardNumber").value.trim();

        const expiry =
            document.getElementById("expiry").value.trim();

        const cvv =
            document.getElementById("cvv").value.trim();


        if (
            cardName === "" ||
            cardNumber === "" ||
            expiry === "" ||
            cvv === ""
        ) {

            alert("Please enter all card details!");
            return;
        }
    }


    // UPI validation
    if (selectedPayment === "UPI") {

        const upiId =
            document.getElementById("upiId").value.trim();

        if (upiId === "") {

            alert("Please enter UPI ID!");
            return;
        }
    }


    // Update booking
    booking.paymentMethod =
        selectedPayment;

    booking.paymentStatus =
        selectedPayment === "Cash"
            ? "Pay at Hotel"
            : "Paid";

    booking.status =
        "Confirmed";

    booking.paymentDate =
        new Date().toLocaleString();


    // Save updated booking
    localStorage.setItem(
        "bookingData",
        JSON.stringify(booking)
    );


    // Get existing bookings
    let bookings =
        JSON.parse(
            localStorage.getItem("myBookings")
        ) || [];


    // Avoid duplicate booking
    const existingIndex =
        bookings.findIndex(function(item) {

            return item.bookingId === booking.bookingId;

        });


    if (existingIndex >= 0) {

        bookings[existingIndex] =
            booking;

    } else {

        bookings.push(booking);

    }


    // IMPORTANT
    localStorage.setItem(
        "myBookings",
        JSON.stringify(bookings)
    );


    alert("Booking Confirmed Successfully!");


    window.location.href =
        "confirmation.html";
}

</script>

</body>
</html>
